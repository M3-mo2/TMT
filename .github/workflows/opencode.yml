# ==============================================================================
# 🤖 AUTONOMOUS MULTI-AGENT PIPELINE
# ==============================================================================
#
# FLOW:
#   workflow_dispatch (you type a feature request)
#        │
#        ▼
#   [BUILD]  → creates branch + PR, implements the feature, labels PR "agent:review"
#        │
#        ▼
#   [REVIEW] ⇄ [FIX]   (loops until clean, or until the safety ceiling is hit)
#        │
#        ▼  (once review is clean)
#   [VERIFY]  → independently re-runs build/tests, does NOT trust Review's verdict
#        │            ↳ if Verify finds new problems, it routes back into [FIX] too
#        ▼  (once verify is clean)
#   [DECISION] → posts a comment asking you: "/merge yes" or "/merge no"
#        │
#        ▼
#   [MERGE GATE] → checks the commenter has write/admin access, then merges (or not)
#
#   [CHAT] (side channel, any time) → any PR comment that is NOT "/merge yes"/"/merge no"
#          is treated as a free-form instruction/question to the pipeline, gated by the
#          SAME write/admin permission check as merge_gate:
#            - if the pipeline is paused (agent:blocked or agent:decision), the comment
#              is recorded and the PR is routed straight to [FIX], which reads it, replies
#              to it in its own PR comment, applies any requested code change, then hands
#              back to [REVIEW] automatically — resuming the normal loop.
#            - if the pipeline is mid-cycle (review/fix/verify actively running), the
#              comment is just recorded; whichever agent runs next reads it and replies.
#            - if the PR's pipeline already finished (agent:merged / agent:closed-by-human),
#              the commenter gets a one-line notice instead of silence.
#
# STATE MACHINE:
#   All routing between stages is done via PR labels (not by scanning comment text),
#   because label events cannot be accidentally re-triggered by an agent quoting a
#   keyword in its own reply. Labels used: agent:review, agent:fix, agent:verify,
#   agent:decision, agent:blocked, agent:merged, agent:closed-by-human.
#
#   Label swapping + cycle counting is done by plain bash/jq steps AFTER each LLM
#   agent runs — never by the LLM itself. This keeps the loop-prevention logic
#   100% deterministic and not dependent on the model "remembering" to behave.
#
#   Free-form human comments are carried in the same state file under
#   "human_messages": [{"author","body","delivered"}]. They are appended by the
#   deterministic "chat" job (never by an LLM), and flipped to delivered:true by the
#   next deterministic routing/handback step that runs after an agent has had a chance
#   to read and address them — same "bash writes state, LLM only reads it" rule as
#   everything else here.
#
# SHARED CONTEXT:
#   Every agent run is stateless (fresh container, no memory of previous runs).
#   Context is carried forward explicitly via a committed file on the PR branch:
#   .github/agent-state.json — containing the original task, the cycle counter,
#   the safety ceiling, the latest findings, pending human messages, and a short
#   history log. Every agent is instructed to read this file (and
#   `gh pr view --comments`) before acting.
#
# REQUIRED ONE-TIME SETUP:
#   1. Secret PAT_TOKEN — a Personal Access Token for the bot account (repo + workflow scopes).
#   2. Update BOT_NAME below (workflow env, AND the literal string inside merge_gate's `if:`,
#      AND the literal string inside chat's `if:` — env context isn't available in job-level
#      `if:` conditions, so all three must be kept in sync by hand) to match the GitHub
#      username tied to PAT_TOKEN.
#   3. Nothing else — pipeline labels are created automatically on first run.
#
# SECURITY NOTE:
#   issue_comment runs with PAT_TOKEN regardless of who commented, which is why
#   merge_gate AND chat both double-check the commenter's actual repo permission via
#   the API before ever calling `gh pr merge` or handing an instruction to an agent.
#   On a public repo, treat this as a real attack surface — don't loosen either check.
#   Without it, any random public commenter could redirect a paid LLM agent to push
#   arbitrary changes to the PR branch (nothing reaches main without a separate
#   write/admin "/merge yes", but it's still a cost and integrity risk worth blocking).
# ==============================================================================

name: 🤖 Multi-Agent Feature Pipeline

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the feature or task"
        required: true
        type: string
      max_cycles:
        description: "Safety ceiling for review<->fix cycles (a hard stop, not a target — big tasks may need many)"
        required: false
        default: "15"
        type: string
      model:
        description: "OpenCode model"
        required: false
        default: "ninerouter/kc/poolside/laguna-s-2.1:free"
        type: string
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  BOT_NAME: "mohamed-AFYU" # ⚠️ غيّر ده لاسم حساب الـ PAT_TOKEN بتاعك
  STATE_FILE: ".github/agent-state.json"

concurrency:
  group: agent-pipeline-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # STAGE 0 — BUILD
  # ============================================================================
  build:
    name: 🏗️ Build Agent
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "${{ env.BOT_NAME }}"
          git config --global user.email "findlapmn@gmail.com"
          git config --global init.defaultBranch main

      - name: 🏷️ Ensure pipeline labels exist
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          declare -a LABELS=(
            "agent:review|0e8a16"
            "agent:fix|d93f0b"
            "agent:verify|1d76db"
            "agent:decision|5319e7"
            "agent:blocked|b60205"
            "agent:merged|0e8a16"
            "agent:closed-by-human|cccccc"
          )
          for L in "${LABELS[@]}"; do
            NAME="${L%%|*}"
            COLOR="${L##*|}"
            gh label create "$NAME" --color "$COLOR" --force
          done

      - name: 🌱 Create working branch
        id: branch
        run: |
          BRANCH="agent/feature-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: 📝 Initialize pipeline state file
        env:
          TASK_PROMPT: ${{ inputs.prompt }}
          MAX_CYCLES: ${{ inputs.max_cycles }}
        run: |
          mkdir -p "$(dirname "$STATE_FILE")"
          jq -n --arg task "$TASK_PROMPT" --argjson maxc "$MAX_CYCLES" \
            '{task:$task, max_cycles:$maxc, cycle:0, status:"building", findings:[], history:[]}' \
            > "$STATE_FILE"
          git add "$STATE_FILE"
          git commit -m "chore(pipeline): init state"
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: 🏗️ Run Build Agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          model: ${{ inputs.model }}
          use_github_token: true
          prompt: |
            You are the BUILD AGENT in a multi-agent pipeline (Build → Review ⇄ Fix → Verify → Decision).

            TASK FROM USER:
            ${{ inputs.prompt }}

            YOU ARE ON BRANCH: ${{ steps.branch.outputs.branch }}

            YOUR JOB:
            1. Inspect the repository and understand its architecture and conventions before writing any code.
            2. Implement the requested feature/fix completely and correctly on this branch.
            3. Run any available build/lint/test commands and fix what you can before finishing.
            4. Commit your work with clear messages.
            5. Push the branch and open a Pull Request against the default branch.
               - PR title: a concise summary of the task.
               - PR description MUST include a "## Pipeline" section explaining this PR is managed by an
                 automated multi-agent pipeline (Build → Review → Fix → Verify → Decision), and that a human
                 will get a final merge confirmation prompt once everything passes.
            6. Post ONE comment on the PR starting with the header "### 🏗️ Build Agent" summarizing what you
               built, key decisions, and anything you were unsure about.
            7. Add the label "agent:review" to the PR to hand off to the Review Agent.

            RULES:
            - Do NOT add or remove any other pipeline label ("agent:fix", "agent:verify", "agent:decision",
              "agent:blocked"). Routing beyond this first handoff is handled by the workflow itself.
            - Do NOT merge anything.
            - Never fake a passing test or a successful build.

  # ============================================================================
  # STAGE 1 — REVIEW
  # ============================================================================
  review:
    name: 🔍 Review Agent
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🔀 Checkout PR branch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh pr checkout ${{ github.event.pull_request.number }}

      - name: 🔍 Run Review Agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          model: ninerouter/kc/poolside/laguna-s-2.1:free
          use_github_token: true
          prompt: |
            You are the REVIEW AGENT in a multi-agent pipeline.

            Before anything else, read the full context:
            - `gh pr view ${{ github.event.pull_request.number }} --comments`
            - the file at $STATE_FILE on this branch (path: .github/agent-state.json), especially the
              "task" and "history" fields, so you know what was actually asked for. Also check
              "human_messages" for any entry with "delivered": false — a human commented directly on this
              PR; briefly acknowledge it in your comment even though only the Fix Agent can act on code
              changes it requests.

            YOUR JOB:
            Review the complete diff of this PR as a senior engineer. Look for bugs, logic errors, security
            issues, performance problems, missing error handling, missing tests for important behavior, and
            any deviation from the task described in the state file.

            Do NOT modify code. Do NOT push any commits except updating the state file as instructed below.

            OUTPUT (do both):
            1. Post ONE PR comment starting with header "### 🔍 Review Agent — Cycle <current cycle from state
               file>" listing every issue found (Title / Severity / File / Why it matters / Suggested fix), or
               clearly stating "No issues found." if the PR is clean. Only report issues you can support with
               evidence from the code — never invent problems just to produce a report.
            2. Update .github/agent-state.json on this branch:
               - set "status" to exactly "issues_found" or "clean"
               - if issues_found: replace "findings" with a JSON array of
                 {"title","severity","file","detail"} objects for THIS cycle only (overwrite, don't append)
               - if clean: set "findings" to an empty array
               - append one object to "history": {"agent":"review","cycle":<current cycle>,"result":"<status>"}
               - before committing, run `git pull --rebase origin ${{ github.event.pull_request.head.ref }}`
                 to reduce the chance of a conflicting write, then commit and push ONLY this file,
                 message: "chore(pipeline): review cycle result". If the push is rejected, pull --rebase
                 again and retry once.

            RULES:
            - Do NOT add or remove any "agent:*" label yourself — the workflow does this automatically based
              on the state file you just wrote.

      - name: 🧭 Route based on review result
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          PR=${{ github.event.pull_request.number }}

          # Always take the remote copy of the branch as ground truth instead of
          # `git pull` (a merge), which can leave real conflict markers inside
          # agent-state.json if another run touched it at the same time.
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          STATUS=$(jq -r '.status' "$STATE_FILE")
          CYCLE=$(jq -r '.cycle' "$STATE_FILE")
          MAXC=$(jq -r '.max_cycles' "$STATE_FILE")

          # Mark any human message the Review Agent just acknowledged as delivered.
          if jq -e '(.human_messages // []) | any(.delivered == false)' "$STATE_FILE" > /dev/null; then
            jq '.human_messages = ((.human_messages // []) | map(.delivered = true))' \
              "$STATE_FILE" > /tmp/state.json && mv /tmp/state.json "$STATE_FILE"
            git add "$STATE_FILE"
            git commit -m "chore(pipeline): mark human messages delivered"
            git push origin "$BRANCH" || { git fetch origin "$BRANCH"; git reset --hard "origin/$BRANCH"; }
          fi

          gh pr edit "$PR" --remove-label "agent:review"

          if [ "$STATUS" = "clean" ]; then
            gh pr edit "$PR" --add-label "agent:verify"
            exit 0
          fi

          if [ "$CYCLE" -ge "$MAXC" ]; then
            gh pr edit "$PR" --add-label "agent:blocked"
            gh pr comment "$PR" --body "### 🛑 Safety ceiling reached
          The pipeline hit its safety limit of **$MAXC** review↔fix cycles without converging.

          Please check the findings above and either:
          - fix things manually and re-add the \`agent:review\` label to resume, or
          - comment with further instructions.

          @${{ github.repository_owner }}"
            exit 0
          fi

          NEWCYCLE=$((CYCLE + 1))

          # Retry loop: if the push is rejected because something else wrote to
          # this branch between our reset and our push, re-fetch, redo the edit
          # on top of the fresh copy, and try again — instead of merging (and
          # possibly conflicting) or just failing outright.
          for ATTEMPT in 1 2 3 4 5; do
            jq --argjson c "$NEWCYCLE" '.cycle = $c' "$STATE_FILE" > /tmp/state.json && mv /tmp/state.json "$STATE_FILE"
            git add "$STATE_FILE"
            git commit -m "chore(pipeline): advance to cycle $NEWCYCLE"

            if git push origin "$BRANCH"; then
              break
            fi

            echo "⚠️ Push rejected (attempt $ATTEMPT/5) — refetching and retrying..."
            git reset --soft HEAD~1
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            sleep $((RANDOM % 3 + 1))

            if [ "$ATTEMPT" -eq 5 ]; then
              echo "❌ Failed to push agent-state.json after 5 attempts." >&2
              gh pr comment "$PR" --repo "${{ github.repository }}" --body "⚠️ Pipeline could not update \`agent-state.json\` after several retries (concurrent write conflict). @${{ github.repository_owner }} please check the Actions log for run ${{ github.run_id }}."
              exit 1
            fi
          done

          gh pr edit "$PR" --add-label "agent:fix"

  # ============================================================================
  # STAGE 2 — FIX
  # ============================================================================
  fix:
    name: 🛠️ Fix Agent
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent:fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🔀 Checkout PR branch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh pr checkout ${{ github.event.pull_request.number }}

      - name: 🛠️ Run Fix Agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          model: ninerouter/kc/poolside/laguna-s-2.1:free
          use_github_token: true
          prompt: |
            You are the FIX AGENT in a multi-agent pipeline.

            Read .github/agent-state.json on this branch — it contains "findings" from the last Review or
            Verify Agent pass (current cycle) and the original "task". It may also contain a "human_messages"
            array — free-form comments a human posted directly on the PR. Treat any entry with
            "delivered": false as addressed to you right now.

            YOUR JOB:
            1. If there are undelivered human_messages, read each one and actually do what it asks (answer a
               question, change direction, implement a specific request) in addition to the review findings.
               If a message conflicts with a review finding, the human's message wins — they're the one paying
               attention right now.
            2. Fix EVERY finding listed. Do not introduce unrelated changes. Run relevant tests/build/lint after
               fixing and confirm they actually pass. Never fake a passing test.

            OUTPUT:
            1. Commit and push your fixes to this branch.
            2. Post ONE PR comment starting with header "### 🛠️ Fix Agent — Cycle <current cycle>" explaining
               what you changed for each finding, AND a short reply to each undelivered human message you saw
               (quote or paraphrase what they asked, then say what you did about it).
            3. Do NOT edit .github/agent-state.json and do NOT touch any "agent:*" label — the workflow hands
               this back to the Review Agent automatically, and also marks your human_messages as delivered.

      - name: 🔁 Mark messages delivered + hand back to Review Agent
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH=$(git branch --show-current)
          PR=${{ github.event.pull_request.number }}

          for ATTEMPT in 1 2 3 4 5; do
            jq '.human_messages = ((.human_messages // []) | map(.delivered = true))' \
              "$STATE_FILE" > /tmp/state.json && mv /tmp/state.json "$STATE_FILE"

            if ! git diff --quiet -- "$STATE_FILE"; then
              git add "$STATE_FILE"
              git commit -m "chore(pipeline): mark human messages delivered"
              if git push origin "$BRANCH"; then
                break
              fi
              echo "⚠️ Push rejected (attempt $ATTEMPT/5) — refetching and retrying..."
              git reset --soft HEAD~1
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              sleep $((RANDOM % 3 + 1))
            else
              break
            fi

            if [ "$ATTEMPT" -eq 5 ]; then
              echo "❌ Failed to mark messages delivered after 5 attempts." >&2
            fi
          done

          gh pr edit "$PR" --remove-label "agent:fix" --add-label "agent:review"

  # ============================================================================
  # STAGE 3 — VERIFY (independent double-check, doesn't trust Review's verdict)
  # ============================================================================
  verify:
    name: ✅ Verify Agent
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent:verify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🔀 Checkout PR branch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh pr checkout ${{ github.event.pull_request.number }}

      - name: ✅ Run Verify Agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          model: ninerouter/kc/poolside/laguna-s-2.1:free
          use_github_token: true
          prompt: |
            You are the VERIFY AGENT — the independent quality gate. Do NOT trust the Review Agent's earlier
            "clean" verdict blindly; re-check everything for yourself.

            YOUR JOB:
            1. Actually run the project's build, lint, and test commands (detect them from the repo — e.g.
               package.json scripts, Makefile, etc.). Report REAL command output, never fabricate results.
            2. Confirm the implementation genuinely satisfies the original task described in
               .github/agent-state.json ("task" field) — not just "no errors", but "does what was asked".
            3. Check "human_messages" in the state file for any entry with "delivered": false and briefly
               acknowledge it in your comment (only the Fix Agent can act on code-change requests from it).
            4. Do NOT modify code.

            OUTPUT (do both):
            1. Post ONE PR comment starting with header "### ✅ Verify Agent" with a summary of the real
               command output and your verdict.
            2. Update .github/agent-state.json:
               - set "status" to "clean" (ready to ask the human) or "issues_found"
               - if issues_found: replace "findings" with the new problems (same schema as Review Agent uses)
               - append to "history": {"agent":"verify","cycle":<current cycle>,"result":"<status>"}
               - before committing, run `git pull --rebase origin ${{ github.event.pull_request.head.ref }}`
                 to reduce the chance of a conflicting write, then commit and push ONLY this file. If the
                 push is rejected, pull --rebase again and retry once.

      - name: 🧭 Route based on verify result
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          PR=${{ github.event.pull_request.number }}

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          STATUS=$(jq -r '.status' "$STATE_FILE")
          CYCLE=$(jq -r '.cycle' "$STATE_FILE")
          MAXC=$(jq -r '.max_cycles' "$STATE_FILE")

          # Mark any human message the Verify Agent just acknowledged as delivered.
          if jq -e '(.human_messages // []) | any(.delivered == false)' "$STATE_FILE" > /dev/null; then
            jq '.human_messages = ((.human_messages // []) | map(.delivered = true))' \
              "$STATE_FILE" > /tmp/state.json && mv /tmp/state.json "$STATE_FILE"
            git add "$STATE_FILE"
            git commit -m "chore(pipeline): mark human messages delivered"
            git push origin "$BRANCH" || { git fetch origin "$BRANCH"; git reset --hard "origin/$BRANCH"; }
          fi

          gh pr edit "$PR" --remove-label "agent:verify"

          if [ "$STATUS" = "clean" ]; then
            gh pr edit "$PR" --add-label "agent:decision"
            exit 0
          fi

          if [ "$CYCLE" -ge "$MAXC" ]; then
            gh pr edit "$PR" --add-label "agent:blocked"
            gh pr comment "$PR" --body "### 🛑 Safety ceiling reached during verification
          @${{ github.repository_owner }} — please take a look at the findings above."
            exit 0
          fi

          NEWCYCLE=$((CYCLE + 1))

          for ATTEMPT in 1 2 3 4 5; do
            jq --argjson c "$NEWCYCLE" '.cycle = $c' "$STATE_FILE" > /tmp/state.json && mv /tmp/state.json "$STATE_FILE"
            git add "$STATE_FILE"
            git commit -m "chore(pipeline): verify found issues, advance to cycle $NEWCYCLE"

            if git push origin "$BRANCH"; then
              break
            fi

            echo "⚠️ Push rejected (attempt $ATTEMPT/5) — refetching and retrying..."
            git reset --soft HEAD~1
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            sleep $((RANDOM % 3 + 1))

            if [ "$ATTEMPT" -eq 5 ]; then
              echo "❌ Failed to push agent-state.json after 5 attempts." >&2
              gh pr comment "$PR" --repo "${{ github.repository }}" --body "⚠️ Pipeline could not update \`agent-state.json\` after several retries (concurrent write conflict). @${{ github.repository_owner }} please check the Actions log for run ${{ github.run_id }}."
              exit 1
            fi
          done

          gh pr edit "$PR" --add-label "agent:fix"

  # ============================================================================
  # STAGE 4 — DECISION (asks the human, does nothing else)
  # ============================================================================
  decision:
    name: 🏁 Decision Gate
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent:decision'
    runs-on: ubuntu-latest
    steps:
      - name: 🏁 Ask for merge confirmation
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "### 🏁 Pipeline complete — awaiting your decision
          The feature has been built, reviewed, fixed as needed, and independently verified. No open issues.

          Reply on this PR with:
          - \`/merge yes\` to squash-merge this PR
          - \`/merge no\` to stop here (PR stays open, nothing happens automatically)

          @${{ github.repository_owner }}"

  # ============================================================================
  # STAGE 5 — MERGE GATE (only reacts to explicit human confirmation)
  # ============================================================================
  merge_gate:
    name: 🔀 Merge Gate
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login != 'mohamed-AFYU' &&
      contains(github.event.issue.labels.*.name, 'agent:decision') &&
      (startsWith(github.event.comment.body, '/merge yes') || startsWith(github.event.comment.body, '/merge no'))
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Verify permission and act on decision
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          PR=${{ github.event.issue.number }}

          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${COMMENT_AUTHOR}/permission" --jq .permission)
          if [ "$PERM" != "admin" ] && [ "$PERM" != "write" ]; then
            gh pr comment "$PR" --body "⚠️ @${COMMENT_AUTHOR} doesn't have permission to confirm a merge on this repo."
            exit 0
          fi

          if [[ "$COMMENT_BODY" == "/merge yes"* ]]; then
            gh pr merge "$PR" --squash --delete-branch
            gh pr edit "$PR" --remove-label "agent:decision" --add-label "agent:merged"
          else
            gh pr comment "$PR" --body "👍 Got it — leaving this PR open without merging."
            gh pr edit "$PR" --remove-label "agent:decision" --add-label "agent:closed-by-human"
          fi

  # ============================================================================
  # STAGE 6 — CHAT RELAY (free-form comments on the PR, outside /merge commands)
  # ============================================================================
  # Triggers on ANY new PR comment that is NOT "/merge yes"/"/merge no" (that stays
  # merge_gate's job) AND only while the pipeline is actively alive on this PR
  # (one of the five non-terminal labels is present). Gated by the same write/admin
  # permission check as merge_gate — see SECURITY NOTE at the top of this file.
  chat:
    name: 💬 Chat Relay
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login != 'mohamed-AFYU' &&
      !startsWith(github.event.comment.body, '/merge yes') &&
      !startsWith(github.event.comment.body, '/merge no') &&
      (contains(github.event.issue.labels.*.name, 'agent:review') ||
       contains(github.event.issue.labels.*.name, 'agent:fix') ||
       contains(github.event.issue.labels.*.name, 'agent:verify') ||
       contains(github.event.issue.labels.*.name, 'agent:blocked') ||
       contains(github.event.issue.labels.*.name, 'agent:decision'))
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Check commenter permission
        id: perm
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          PR=${{ github.event.issue.number }}
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${COMMENT_AUTHOR}/permission" --jq .permission)
          if [ "$PERM" != "admin" ] && [ "$PERM" != "write" ]; then
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "⚠️ @${COMMENT_AUTHOR} doesn't have permission to direct the pipeline on this repo. Only \`/merge yes\`/\`/merge no\` from the pipeline owner is handled without write access."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.perm.outputs.allowed == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: ⚙️ Configure Git
        if: steps.perm.outputs.allowed == 'true'
        run: |
          git config --global user.name "${{ env.BOT_NAME }}"
          git config --global user.email "findlapmn@gmail.com"

      - name: 🔀 Checkout PR branch
        id: pr_branch
        if: steps.perm.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR=${{ github.event.issue.number }}
          gh pr checkout "$PR" --repo "${{ github.repository }}"
          echo "branch=$(git branch --show-current)" >> "$GITHUB_OUTPUT"

      - name: 📝 Record the message and route it
        if: steps.perm.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          PR=${{ github.event.issue.number }}
          BRANCH="${{ steps.pr_branch.outputs.branch }}"

          for ATTEMPT in 1 2 3 4 5; do
            jq --arg author "$COMMENT_AUTHOR" --arg body "$COMMENT_BODY" \
              '.human_messages = ((.human_messages // []) + [{"author":$author,"body":$body,"delivered":false}])' \
              "$STATE_FILE" > /tmp/state.json && mv /tmp/state.json "$STATE_FILE"
            git add "$STATE_FILE"
            git commit -m "chore(pipeline): record human message from $COMMENT_AUTHOR"

            if git push origin "$BRANCH"; then
              break
            fi

            echo "⚠️ Push rejected (attempt $ATTEMPT/5) — refetching and retrying..."
            git reset --soft HEAD~1
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            sleep $((RANDOM % 3 + 1))

            if [ "$ATTEMPT" -eq 5 ]; then
              echo "❌ Failed to record human message after 5 attempts." >&2
              gh pr comment "$PR" --repo "${{ github.repository }}" --body "⚠️ Couldn't record your message due to a write conflict — please try again in a moment. @${COMMENT_AUTHOR}"
              exit 1
            fi
          done

          PAUSED_LABEL=$(gh pr view "$PR" --repo "${{ github.repository }}" --json labels --jq \
            '[.labels[].name] | map(select(. == "agent:blocked" or . == "agent:decision")) | .[0] // empty')

          if [ -n "$PAUSED_LABEL" ]; then
            gh pr edit "$PR" --repo "${{ github.repository }}" --remove-label "$PAUSED_LABEL" --add-label "agent:fix"
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "👋 Got it @${COMMENT_AUTHOR} — picking this up now. The Fix Agent will reply here once it's looked at your message."
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "👋 Noted @${COMMENT_AUTHOR} — the pipeline is mid-cycle right now; the next agent that runs will read and reply to your message."
          fi

  # ============================================================================
  # STAGE 7 — CHAT (pipeline already finished) — one-line notice instead of silence
  # ============================================================================
  chat_closed_notice:
    name: 💬 Chat (pipeline finished)
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login != 'mohamed-AFYU' &&
      !startsWith(github.event.comment.body, '/merge yes') &&
      !startsWith(github.event.comment.body, '/merge no') &&
      (contains(github.event.issue.labels.*.name, 'agent:merged') ||
       contains(github.event.issue.labels.*.name, 'agent:closed-by-human'))
    runs-on: ubuntu-latest
    steps:
      - name: 💬 Let the commenter know the pipeline already ended
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR=${{ github.event.issue.number }}
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "ℹ️ This PR's pipeline already finished (merged or closed) — I'm not picking up new instructions here. Start a new run with workflow_dispatch if you'd like more changes."
