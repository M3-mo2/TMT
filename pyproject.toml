[project]
name = "tmt-bot"
version = "1.0.0"
description = "Telegram member transfer bot — aiogram (Bot API) + Telethon (User API), SQLite, Arabic UI"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31,<4",
    "telethon>=1.44,<2",
    "aiosqlite>=0.20,<1",
    "cryptography>=44",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:telethon.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
